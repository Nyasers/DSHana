name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  # 包集先建一次：T1 包集缓存（.cache/dsh-build/<key>）是构建产物、不进仓库，
  # 而派生闸里的包集清单对拍要读它（清单是提交的产物，对拍得有那次构建的缓存做底）。
  # 该构建跨平台通用——键由 tag/commit/配方/node/pnpm/上游锁/delta 算出，不含 OS，
  # 仓库里也只有一份清单，所有出包目标共用——所以一个 job 建、其余 job 用缓存消费，谁都不必重建。
  # build.mts 本身幂等：命中只打印 cache hit 后返回，缺失才真构建。
  dsh-package-set:
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，CI 要可复现的环境
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）；
          # 浅克隆拿不到 tag，submodule 不递归则目录为空。两者都必要。
          submodules: recursive
          fetch-depth: 0
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 缓存键用仓库自己算的那个（与清单记的 cacheKey 同口径）：命中即跳过构建，
      # 未命中则建一次并在这里存下，后续运行与下游 job 直接命中。
      - id: dshset
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/dsh-build
          key: dsh-build-${{ steps.dshset.outputs.key }}
      - run: pnpm run build:dsh

  build-and-audit:
    needs: dsh-package-set
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，CI 要可复现的环境
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）；
          # 浅克隆拿不到 tag，submodule 不递归则目录为空。两者都必要。
          submodules: recursive
          fetch-depth: 0
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 取上游 job 建好的包集（同一把键）。缺了不静默降级：下一步会因"缓存条目不存在"硬失败。
      - id: dshset
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/dsh-build
          key: dsh-build-${{ steps.dshset.outputs.key }}
      # 派生文件闸：manifest / cordis 子插件版本 / 交付面清单与锁 / 镜像 paths / 包集清单都是派生产物，
      # 本地跑 `node scripts/derive/index.mts` 写回后要一并提交，这一步拦「忘了提交」。
      # 其中包集清单要对拍 T1 缓存（上一步已取到）；缓存缺失时这一步硬失败，不静默跳过。
      - run: pnpm run derive:check
      - run: pnpm run build
      # 单测：node --test tests/，含 provider / task-bridge / watch-sse / cancel-chain / approval-bridge 等
      - run: pnpm run test
      - run: pnpm audit --audit-level=high
