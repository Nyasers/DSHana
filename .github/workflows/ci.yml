name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  # 包集先建一次：T1 包集（.cache/dsh-build/<key>）是构建产物、不进仓库，而派生闸里的包集清单
  # 对拍要读它。构建跨平台通用——键由 tag/commit/配方/node/pnpm/上游锁/delta 算出、不含 OS，
  # 仓库里也只有一份清单，所有出包目标共用——所以一个 job 建、下游拿。
  # 同一次运行内用 artifact 交接（cache 的写入是后置的、不保证对下游立刻可见）；Actions cache
  # 只当**跨运行的纯加速**：命中即免构建，缺席也是正确路径（重新构建一次）。
  dsh-package-set:
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，CI 要可复现的环境
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）；
          # 浅克隆拿不到 tag，submodule 不递归则目录为空。两者都必要。
          submodules: recursive
          fetch-depth: 0
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 缓存键用仓库自己算的那个（与包集清单记的 cacheKey 同口径）
      - id: dshset
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/dsh-build
          key: dsh-build-${{ steps.dshset.outputs.key }}
      - run: pnpm run build:dsh
      # 清单与交付锁也是**该缓存条目**的产物（B 节起它们住条目里，不进仓库）：在下游的
      # derive:check 之前先把它们派生出来，随 artifact 一起交接。没有这一步，下游会看到
      # 「包集在、清单不在」——那是没派生，不是漂移。
      - run: node scripts/derive/index.mts package-set package-lock
      # 交给下游 job：artifact（不是 cache）——同一次运行内的中间产物按它的本分走这里
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-package-set-${{ steps.dshset.outputs.key }}
          retention-days: 7
          path: .cache/dsh-build/${{ steps.dshset.outputs.key }}
          if-no-files-found: error

  build-and-audit:
    needs: dsh-package-set
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，CI 要可复现的环境
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）；
          # 浅克隆拿不到 tag，submodule 不递归则目录为空。两者都必要。
          submodules: recursive
          fetch-depth: 0
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: dshset
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: dsh-package-set-${{ steps.dshset.outputs.key }}
          path: .tmp/dsh-set
      # artifact 的目录层次不做假设：按 build-recipe.json 认出真正的条目目录，再摆进缓存位置
      - name: Place package set
        env:
          KEY: ${{ steps.dshset.outputs.key }}
        run: |
          set -e
          SRC=$(dirname "$(find .tmp/dsh-set -name build-recipe.json -print -quit)")
          [ -n "$SRC" ] || { echo "::error::artifact 里没有 build-recipe.json"; exit 1; }
          mkdir -p .cache/dsh-build
          rm -rf ".cache/dsh-build/$KEY"
          mv "$SRC" ".cache/dsh-build/$KEY"
      # 派生文件闸：manifest / cordis 包版本 / 包根铭牌 / 镜像 paths 都是派生产物，本地跑
      # `node scripts/derive/index.mts` 写回后要一并提交，这一步拦「忘了提交」。
      # 包集清单与交付锁（上一步随 artifact 取到）另做**自洽**校验：与现算的根集/字节/身份对拍，
      # 缓存缺失时硬失败，不静默跳过。
      - run: pnpm run derive:check
      - run: pnpm run build
      # 单测：node --test tests/，含 provider / task-bridge / watch-sse / cancel-chain / approval-bridge 等
      - run: pnpm run test
      - run: pnpm audit --audit-level=high
