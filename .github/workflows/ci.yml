name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build-and-audit:
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，CI 要可复现的环境
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）；
          # 浅克隆拿不到 tag，submodule 不递归则目录为空。两者都必要。
          submodules: recursive
          fetch-depth: 0
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T1 包集缓存（构建产物，不进仓库）：包集清单对拍与出包物化都读它。
      # 命中就用、缺失就建——build.mts 自身幂等（命中只打印 cache hit 后返回），
      # 所以干净环境不需要人先手工跑一次构建，这条链由此自愈。
      - id: dshset
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/dsh-build
          key: dsh-build-${{ steps.dshset.outputs.key }}
      - run: pnpm run build:dsh
      # 派生文件闸：manifest / cordis 子插件版本 / 交付面清单与锁 / 镜像 paths / 包集清单都是派生产物，
      # 本地跑 `node scripts/derive/index.mts` 写回后要一并提交，这一步拦「忘了提交」。
      # 其中包集清单要对拍 T1 缓存（上一步已确保在位）；缓存缺失时这一步硬失败，不静默跳过。
      - run: pnpm run derive:check
      - run: pnpm run build
      # 单测：node --test tests/，含 provider / task-bridge / watch-sse / cancel-chain / approval-bridge 等
      - run: pnpm run test
      - run: pnpm audit --audit-level=high
