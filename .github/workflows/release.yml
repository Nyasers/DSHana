# Release — 并发矩阵出包（4 平台 + 通用兜底）+ 单点发布
#
# 触发：push tag v*（发版）/ workflow_dispatch（手动，仅出 artifact 不建 release）
#
# 三段式（骨架对齐宿主 openhanako build.yml，按本项目交付物裁剪）：
#   create-release：先建 draft pre-release（已存在则跳过）——保证后续上传目标必然存在
#   package：矩阵并发，每目标一个 runner（公开仓库分钟数免费，用并发换时间）。每 job 自包含
#            （安装 + 构建 + 出包），产物名带目标后缀，zip + sha256 上传为 artifact。
#   publish：needs package。下载全部 artifact → **单点上传**（--clobber；多 job 并发写同一
#            release 有互相覆盖的窗口，宿主 workflow 特意注明过）→ 硬校验必需资产（缺一即
#            fail，release 留 draft 供人工检查）→ **全部成功才去掉 draft、保留 prerelease**
#            （不自动标 latest，稳定版由人工标记）。
#   package-extra：宿主矩阵之外的两个平台单独一个手动作业（dispatch 且勾选才跑），只产
#            artifact、不进 release——发版面因此钉死在宿主支持矩阵内。
#
# 与宿主 workflow 的关键差异：
#   - 宿主需要 mac/win/linux 三平台 runner（要编译原生 helper、签名、公证）；本项目交付物是纯 JS +
#     预编译依赖，各平台包都能在 ubuntu 上产出，矩阵不必跨 OS。
#   - 宿主单建 renderer box 再分发给各平台（解决 tar mtime 导致"内容相同、字节不同"）；我们的包
#     本就逐目标不同，不适用，故每 job 自包含，省掉 artifact 分发的接线。
#   - 目标集对着宿主支持矩阵写：macOS arm64/x64、Windows x64、Linux x86_64（glibc）；
#     另有 universal 兜底包（os × cpu 全叉乘）。宿主矩阵外的平台（linux-arm64 / win32-arm64）
#     走 `package-extra` 那个手动门远程出包，或本地点名 `pnpm run package --target=<名字>`
#     （见 package.json 的 package:* 别名）。
#
# 产物命名与单一事实源：`dshana-v<version>[-<target>].zip`；version 取自 package.json，
# pack.mts 会断言 manifest 与 cordis 包版本一致，不一致直接拒包（fail-closed）。
#
# runner 一律钉 ubuntu-24.04，不用 ubuntu-latest：镜像换代是 GitHub 侧的静默变化，
# 发版流水线要的是可复现的构建地基，不能让 latest 在某个发版日悄悄换掉它。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      extra_platforms:
        description: 额外出 linux-arm64 / win32-arm64 两个平台件（只产 artifact，不进 release）
        type: boolean
        default: true

jobs:
  # 先建 release（仅 tag 场景）：package/publish 都 needs 它，保证上传时 release 必已存在。
  # dispatch 手动场景无 tag，本 job 被 if 跳过，package 照常跑（只产 artifact）。
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）。
          submodules: recursive
          fetch-depth: 0

      # 建 draft + pre-release：上传完并校验通过后才由 publish job 去掉 draft。
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tag 名经 env 传入，不在 shell 里裸插值 ${{ }}——见文件末尾「注入防护」注释
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create"
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "$TAG" \
              --generate-notes
          fi

  # 并发矩阵：每个目标一个 runner。fail-fast: false —— 一个目标失败不影响其余目标跑完，
  # 便于一次看到全部失败面。
  package:
    needs: create-release
    # create-release 仅在 tag 场景运行，dispatch 场景会被 skip。job 的 if 里不带状态函数时，
    # GitHub 会隐式前置 success()，而 success() 在上游被 skip 时为假 —— 单写 result 判断够不着。
    # 用 !cancelled() 顶掉那个隐式前置：流水线被取消时不启动，其余情况按「上游非 failure」放行。
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, darwin-arm64, darwin-x64, win32-x64, universal]

    steps:
      - uses: actions/checkout@v7
        with:
          # package 链会跑 prepackage（derive + build），同样要读 submodule 的 tag。
          submodules: recursive
          fetch-depth: 0

      # 显式装 pnpm（读 package.json packageManager 钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepackage 钩子自动前置 derive + build；pack 按目标做干净安装并断言该平台的预编译资产
      - name: Package ${{ matrix.target }}
        run: pnpm run package --target=${{ matrix.target }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          retention-days: 3
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error

  # 宿主矩阵之外的两个平台：只在手动门里出包，默认不进 release。
  # 与 package 分开成一个作业，是为了让发版面的资产集合可预测（tag 触发的运行里这个作业
  # 根本不启动），也让这两个平台出包失败影响不到发布链路。
  package-extra:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_platforms }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, win32-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          # package 链会跑 prepackage（derive + build），同样要读 submodule 的 tag。
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package ${{ matrix.target }}
        run: pnpm run package --target=${{ matrix.target }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          retention-days: 3
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error

  # 市场清单：从各 target 的产物派生 entry，并拼出 index.v2.json。
  # 索引模型是「每版本一个归档位」（item 只有 archive.url，没有平台维度），所以只放 universal，
  # 平台包留在 release 资产里按名取用——详见 scripts/release/market-index.mts 头注。
  market-index:
    needs: package
    # needs 链上只要有一环被 skip，GitHub 的隐式 success() 就会沿链传染下来把本 job 也跳过——
    # 即使直接上游 package 是 success（tag 场景 create-release 不跑，dispatch 场景反过来，必然有一环 skip）。
    # 所以 !cancelled() 必须与显式的 needs 判断成对出现：单加状态函数会把“上游必须成功”这层一并顶掉。
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package 作业在 job 内跑 prepackage（derive + build）后才打包，**derive 的结果不提交**；
      # 而本作业要按版本号筛归档，读的是仓库里已提交的 src/manifest.json。若 tag 上那份 manifest
      # 落后于 package.json（历史出现过只 bump package.json 的情况），这里会按旧版本号筛空、
      # 连带把 publish 拖住。故先同步一次——manifest 任务只做 package.json#version → manifest，
      # 纯文件改写，不碰 submodule / git / build。
      - name: Derive manifest
        run: pnpm run derive:manifest

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Derive market index
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          mkdir -p releases
          find artifacts -name '*.zip' -exec cp {} releases/ \;
          find artifacts -name '*.zip.sha256' -exec cp {} releases/ \;
          pnpm run index -- \
            --target universal \
            --base-url "https://github.com/${REPO}/releases/download/${TAG}" \
            --publisher "${OWNER}" \
            --source-id "dshana" \
            --name "DSHana" \
            --out index.v2.json
          echo "--- index.v2.json (head) ---"
          head -c 400 index.v2.json

      - uses: actions/upload-artifact@v7
        with:
          name: market-index
          retention-days: 3
          path: index.v2.json
          if-no-files-found: error

  # 单点发布：所有出包成功后才跑到这里；任一出包失败则本 job 不执行，release 留在 draft。
  publish:
    needs: [package, market-index]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 单点上传：把 5 个 zip + 5 个 sha256 一起传上去（--clobber 幂等，补传不报错）
      - name: Upload release assets (single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "  uploading $f"
            gh release upload "$TAG" "$f" --clobber
            found=$((found+1))
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.zip.sha256' -o -name 'index.v2.json' \) -print0)
          [ "$found" -gt 0 ] || { echo "::error::no package assets found in artifacts/"; exit 1; }

      # 硬校验：必需资产缺一个就 fail，release 停在 draft 供人工检查（不出现"残缺发布"）
      - name: Verify required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VER="${TAG#v}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "=== release assets ==="; echo "$ASSETS"; echo ""

          REQUIRED=""
          for t in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            REQUIRED="$REQUIRED dshana-v${VER}-${t}.zip dshana-v${VER}-${t}.zip.sha256"
          done
          REQUIRED="$REQUIRED dshana-v${VER}.zip dshana-v${VER}.zip.sha256"
          # 市场清单：客户端指向 releases/latest/download/index.v2.json 就能装包
          REQUIRED="$REQUIRED index.v2.json"

          MISSING=()
          for f in $REQUIRED; do
            echo "$ASSETS" | grep -qx "$f" || MISSING+=("$f")
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::缺少必需资产：${MISSING[*]}"
            echo "release 保持 draft 供人工检查"
            exit 1
          fi
          echo "✓ 全部必需资产齐备（4 平台包 + 通用包，各带 sha256，外加市场清单 index.v2.json）"

      # 全部构建成功且资产齐备 → 去掉 draft、保留 prerelease（稳定版由人工标 latest）
      - name: Un-draft (keep prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --prerelease --draft=false

# 注入防护：run 块内不裸插值 ${{ github.* }}。GitHub 在 Bash 解析**之前**展开表达式，
# tag 里一个 " 加 ; 就能越出引号执行命令（CWE-78）。约定：凡进 shell 的 github 上下文字段
# 一律先经步骤级 env 落成 shell 变量（TAG/REPO/OWNER 等）再引用。
#
# 遗留（未随本 PR 处理）：package 作业的 `pnpm run package --target=${{ matrix.target }}`
# 与 upload-artifact 的 name 仍在裸插值。它们的取值来自本仓库自己的 matrix 定义、不是外部输入，
# 风险面不同（tag 是外部可触发的那一类），故单独留待统一处理。
