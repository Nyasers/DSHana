# Release — 并发矩阵出包（6 平台）+ 通用包与投稿条目单独一条线 + 单点发布
#
# 触发：push tag v*（发版）/ workflow_dispatch（手动，仅出 artifact 不建 release）
#
# 四段式（骨架对齐宿主 openhanako build.yml，按本项目交付物裁剪）：
#   create-release：先建 draft pre-release（已存在则跳过）——保证后续上传目标必然存在
#   package：矩阵并发，每平台目标一个 runner（公开仓库分钟数免费，用并发换时间）。每 job 自包含
#            （安装 + 构建 + 出包），tag 场景把本目标那份件直传 release；分支上的 dispatch
#            只产 artifact，「单跑打包」靠这条成立。
#   universal-market：通用包与投稿条目合成单独一条线，与平台矩阵**并行**（不消费矩阵的产物），
#            同一个作业里先出通用包、再就地对那份 zip 现算事实派生条目，两件一起直传 release。
#            <kind>-<id>-<version>.entry.json 由官方目录按名取件，指向的正是本作业刚出的包；
#            不再经跨作业的事实小票 artifact 中转，少一条旁路，也就少一处可能对不上的中间物。
#   publish：needs package + universal-market。只做硬校验（必需资产缺一即 fail，release 留 draft
#            供人工检查）与去 draft、保留 prerelease（不自动标 latest，稳定版由人工标记）。
# 上传者从单点改成各作业自负：每个上传者只写自己那几个文件名，件与件互不相干（宿主 workflow
# 提示的覆盖窗口指的是同名件或 release 元数据的并发改写），--clobber 幂等。
#
# 与宿主 workflow 的关键差异：
#   - 宿主需要 mac/win/linux 三平台 runner（要编译原生 helper、签名、公证）；本项目交付物是纯 JS +
#     预编译依赖，各平台包都能在 ubuntu 上产出，矩阵不必跨 OS。
#   - 宿主单建 renderer box 再分发给各平台（解决 tar mtime 导致"内容相同、字节不同"）；我们的包
#     本就逐目标不同，不适用，故每 job 自包含，省掉 artifact 分发的接线。
#   - 平台目标集 = 六个 os × cpu 组合（macOS arm64/x64、Windows x64/arm64、Linux x64/arm64 glibc），
#     进发布矩阵并发出包；universal 兜底包（os × cpu 全叉乘，给不在六种组合里的部署）不进矩阵，
#     由 universal-market 作业单独出——它和跟着它派的投稿条目是一条线。本地点名
#     `pnpm run package --target=<名字>` 各目标照样出包（见 package.json 的 package:* 别名）。
#
# 产物命名与单一事实源：`dshana-v<version>[-<target>].zip`；version 取自 package.json，
# scripts/release/pack/index.mts 会断言 manifest 与 cordis 包版本一致，不一致直接拒包（fail-closed）。
#
# runner 一律钉 ubuntu-24.04，不用 ubuntu-latest：镜像换代是 GitHub 侧的静默变化，
# 发版流水线要的是可复现的构建地基，不能让 latest 在某个发版日悄悄换掉它。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 先建 release（仅 tag 场景）：package / universal-market / publish 都 needs 它，保证上传时 release 必已存在。
  # dispatch 手动场景无 tag，本 job 被 if 跳过，两条出包线照常跑（只产 artifact）。
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）。
          submodules: recursive
          fetch-depth: 0

      # 建 draft + pre-release：上传完并校验通过后才由 publish job 去掉 draft。
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tag 名经 env 传入，不在 shell 里裸插值 ${{ }}——见文件末尾「注入防护」注释
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create"
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "$TAG" \
              --generate-notes
          fi

  # 并发矩阵：每个目标一个 runner。fail-fast: false —— 一个目标失败不影响其余目标跑完，
  # 便于一次看到全部失败面。
  package:
    needs: create-release
    # create-release 仅在 tag 场景运行，dispatch 场景会被 skip。job 的 if 里不带状态函数时，
    # GitHub 会隐式前置 success()，而 success() 在上游被 skip 时为假 —— 单写 result 判断够不着。
    # 用 !cancelled() 顶掉那个隐式前置：流水线被取消时不启动，其余情况按「上游非 failure」放行。
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-24.04
    # 写权限是为了 tag 场景直传自己那两份件；分支上的 dispatch 不碰 release。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 只列平台目标：universal 与投稿条目走 universal-market 那条线。
        target: [linux-x64, linux-arm64, win32-x64, win32-arm64, darwin-x64, darwin-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          # package 链会跑 prepackage（derive + build），同样要读 submodule 的 tag。
          submodules: recursive
          fetch-depth: 0

      # 显式装 pnpm（读 package.json packageManager 钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepackage 钩子自动前置 derive + build；pack 按目标做干净安装并断言该平台的预编译资产
      - name: Package ${{ matrix.target }}
        run: pnpm run package --target=${{ matrix.target }}

      # 分支上的 dispatch 没有 release 可写，产物以 artifact 形式留 3 天供人工取用；
      # tag 场景走下一步直传 release，不必再占一份 artifact 存储。
      - name: Upload package artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          retention-days: 3
          path: releases/*.zip
          if-no-files-found: error

      # 直传 release：本作业只写自己的包文件，件与件互不相干。
      - name: Upload release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          count=0
          for f in releases/*.zip; do
            [ -f "$f" ] || continue
            echo "  uploading $f"
            gh release upload "$TAG" "$f" --clobber
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "::error::no package assets to upload"; exit 1; }

  # 通用包与投稿条目：一条线跑到底。本作业先出 universal 兜底包，再就地对那份 zip 现算事实
  # 派生出官方目录按名取件的那一份 app-<id>-<version>.entry.json，两件一起直传 release。
  # 官方索引是「每版本一个归档位」（item 只有 archive.url，没有平台维度），所以条目只指 universal，
  # 平台包留在 release 资产里按名取用——详见 scripts/release/market-entry.mts 头注。
  # 条目指向的包与本作业出的包是同一份文件，「一条线」同时消掉了「条目与包分居两个作业、
  # 靠事实小票对齐」那层间接。
  universal-market:
    needs: create-release
    # 与平台矩阵并行：这条线不消费矩阵的任何产物（事实对本地那份 zip 现算）。挂在 create-release
    # 后面是为了上传时 release 必已存在；dispatch 场景它被 skip，判据同 package 那条（见那里的说明）。
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-24.04
    # 写权限是为了 tag 场景直传通用包与条目。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # package 链会跑 prepackage（derive + build），同样要读 submodule 的 tag。
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepackage 钩子自动前置 derive + build；derive 顺带把 manifest.json 同步到 package.json 的版本，
      # 下一步的条目就按这份 manifest 取名（不再单独补一次 derive:manifest）。
      - name: Package universal
        run: pnpm run package --target=universal

      # 事实就地从 releases/ 里这份 zip 现算（字节数 + sha256），不经任何中转件。
      - name: Derive enrollment entry
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          pnpm run market:entry -- \
            --target universal \
            --publisher "${OWNER}"
          echo "--- enrollment entry (head) ---"
          head -c 400 releases/app-*.entry.json

      # 分支上的 dispatch 没有 release 可写，通用包与条目一并留 artifact 供人工取用。
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: pkg-universal
          retention-days: 3
          path: releases/dshana-v*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: market-entry
          retention-days: 3
          path: releases/app-*.entry.json
          if-no-files-found: error

      # 直传 release（tag 场景）：条目与它指的通用包出自同一次出包。
      - name: Upload universal package and entry to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release upload "$TAG" releases/dshana-v*.zip releases/app-*.entry.json --clobber

  # 收口：矩阵（打包 + 直传）与通用包线（出包 + 派生条目 + 直传）都成功后才跑到这里；任一环失败则
  # 本 job 不执行，release 留在 draft。本作业不写任何资产，只做必需资产的硬校验与去 draft；它也没有 checkout，
  # 因此每个 gh 调用都得用 -R 显式给出仓库（否则 gh 会去读 .git 而直接失败）。
  publish:
    needs: [package, universal-market]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 硬校验：必需资产缺一个就 fail，release 停在 draft 供人工检查（不出现"残缺发布"）
      - name: Verify required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VER="${TAG#v}"
          ASSETS=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name')
          echo "=== release assets ==="; echo "$ASSETS"; echo ""

          REQUIRED=""
          for t in linux-x64 darwin-arm64 darwin-x64 win32-x64 linux-arm64 win32-arm64; do
            REQUIRED="$REQUIRED dshana-v${VER}-${t}.zip"
          done
          REQUIRED="$REQUIRED dshana-v${VER}.zip"
          # 官方目录按名取件的投稿条目（名字随版本，与 manifest 同步）
          REQUIRED="$REQUIRED app-dshana-${VER}.entry.json"

          MISSING=()
          for f in $REQUIRED; do
            echo "$ASSETS" | grep -qx "$f" || MISSING+=("$f")
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::缺少必需资产：${MISSING[*]}"
            echo "release 保持 draft 供人工检查"
            exit 1
          fi
          echo "✓ 全部必需资产齐备（6 平台包 + 通用包，外加投稿条目 app-dshana-${VER}.entry.json）"

      # 全部构建成功且资产齐备 → 去掉 draft、保留 prerelease（稳定版由人工标 latest）
      - name: Un-draft (keep prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" -R "$REPO" --prerelease --draft=false

# 注入防护：run 块内不裸插值 ${{ github.* }}。GitHub 在 Bash 解析**之前**展开表达式，
# tag 里一个 " 加 ; 就能越出引号执行命令（CWE-78）。约定：凡进 shell 的 github 上下文字段
# 一律先经步骤级 env 落成 shell 变量（TAG/REPO/OWNER 等）再引用。
#
# 遗留（未随本 PR 处理）：package 作业的 `pnpm run package --target=${{ matrix.target }}`
# 与 upload-artifact 的 name 仍在裸插值。它们的取值来自本仓库自己的 matrix 定义、不是外部输入，
# 风险面不同（tag 是外部可触发的那一类），故单独留待统一处理。
