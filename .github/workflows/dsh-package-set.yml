# DSH package set — 把 T1 包集按 key 发布成一个内部产物
#
# 为什么要有这条：包集（318 个上游 DSH tarball + build-recipe.json）是构建产物、不进仓库，
# 而 `release:pack` 的字节**不可跨机复现**，所以"各机器各自重建"必然让清单里的 sha512 在别处
# 对不上（CI 上就是一片"字节/摘要不符"）。让所有地方都用**同一份** tarball 是唯一站得住的
# 办法：按 key 发布一次，缺缓存时下载它（见 scripts/vendor/build.mts 的 tryFetchPublishedSet）。
#
# 发布位置：tag `dsh-set-<key>`（prerelease，不进 releases/latest），资产
# `dsh-package-set-<key>.tar` + `.sha256`。它是**内部构建输入，不是发行包**——发行包仍是各平台
# zip（见 release.yml）；归档用裸 tar，展开走仓库自带的纯 JS 解包（scripts/vendor/tar-extract.mts）。
#
# 触发：master 上会改变包集键的路径（上游镜像指针、构建配方、集成 delta、锁与工具链声明）
# 自动跑，或手动 workflow_dispatch。已发布则空转（只算 key、查一次存在与否）。
name: DSH package set

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - vendor/deepseek-harness
      - scripts/vendor/**
      - scripts/integrations/**

jobs:
  publish:
    # runner 钉具体版本：镜像换代是 GitHub 侧的静默变化，构建地基要可复现
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/deepseek-harness 是 submodule，镜像校验要读它的 tag（dsh-v<版本>）
          submodules: recursive
          fetch-depth: 0

      # 显式装 pnpm（读 package.json packageManager 钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 缓存键用仓库自己算的那个（与包集清单记的 cacheKey 同口径）
      - id: key
        run: echo "key=$(node scripts/vendor/build.mts --print-key)" >> "$GITHUB_OUTPUT"

      - name: Check published set
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          if gh release view "dsh-set-$KEY" >/dev/null 2>&1; then
            echo "已发布 dsh-set-$KEY：本次空转"
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      # 缺则建：build.mts 自身幂等，且会先试着下载已发布的那份（本次必然没有），下不到才真构建
      - name: Build package set
        if: steps.published.outputs.exists == '0'
        run: pnpm run build:dsh

      # 裸 tar（内容是 <key>/ 目录：build-recipe.json + dist-npm/）。不压缩：内层 .tgz 本就压过，
      # 且展开方是仓库自带的纯 JS 解包。名字与 tag 都带 key，一眼不是发行包。
      - name: Pack and publish
        if: steps.published.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -e
          ASSET="dsh-package-set-${KEY}.tar"
          tar -cf "$ASSET" -C .cache/dsh-build "$KEY"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "dsh-set-${KEY}" \
            --prerelease \
            --title "DSH package set ${KEY}" \
            --notes "内部构建输入（T1 包集）：318 个上游 DSH tarball + build-recipe.json。不是发行包；发行包见各平台 zip。下载方：scripts/vendor/build.mts 的 tryFetchPublishedSet。" \
            || true
          gh release upload "dsh-set-${KEY}" "$ASSET" "$ASSET.sha256" --clobber
          echo "已发布 dsh-set-${KEY} / $ASSET"
