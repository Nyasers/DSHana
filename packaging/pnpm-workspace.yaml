# 交付面的 pnpm 配置：出包工位（.tmp/pkg-root/<target>）与锁文件派生（scripts/derive/package-lock.mts）
# 都用这一份。工位因此是一个自足的项目：package.json + pnpm-lock.yaml + 本文件，不需要仓库根那份
# 构建面配置。
#
# allowBuilds：dsh 运行时树里有 install scripts 的包（不授权就没有原生产物，装出来的包跑不起来）。
# 与仓库根那份是同一张名单（那边服务本地开发安装，这边服务随包物化）。
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  koffi: true
  node-pty: true
  protobufjs: true

# 交付面的 alpha 依赖（@deepseek-ai/dsh 常停在新发布的 alpha 上）要走 supply-chain 检查的例外，
# 与仓库根那份同款。
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

# >>> pack-targets
# 打包目标设置（scripts/release/pack/targets.mts 会按目标替换标记块内的 supportedArchitectures；
# 勿在标记外重复定义）。这一份是**全叉乘**：锁文件派生按它做，覆盖所有平台；
# 出包时按目标窄化，或保留全叉乘出通用兜底包。
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
# <<< pack-targets
