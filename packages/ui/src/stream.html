<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 本页的面（role）的事实源：静态声明。stream 面 = **会话流**——
     复用 DSH 前端、只留中列那一段转录，DSH 侧栏与右列收起；输入卡保留：
     在这里打的字进的是这个 DSH 会话自己的一轮，不走 dshana 工具链（那条链是模型侧的委派）。 -->
<meta name="hana-dshana-role" content="stream">
<title>DSHana 会话</title>
<!-- packages/ui/src/stream.html — dshana 的会话卡，同一页两个挂载态（由 stream-entry.ts 认）：
       · 聊天流里（宿主 mount 的 height 是 flexible）：只画一行入口（会话坐标），不注入 DSH、
         不连中继——所以不叠也不冻结。这是工具出卡（details.card）落进来的形态。
       · 取出到黑板 / 拆窗（height 是 fixed）：宿主把同一 route 装到新挂载上，本页此时才装配
         中继、注入完整 DSH 现场（./face-stage.css 的台面 → DSH Web UI）。
     两种进入方式共用这一页：聊天卡带 sid=<DSH session id> 钉住一段会话；主题、surface
    凭据与「认面」都走壳脚本那一套（见 stream-entry.ts / stream-stage.tsx / face-role.ts）。
    主题：首帧由下面 <head> 里的内联片段贴样式表（所有静态样式表之后），此后由
    packages/ui/src/host-theme.ts 订阅跟随（stream-entry.ts 侧接上）。
    
    **首帧坐标不排在任何握手后面**：入口行就在下面的 DOM 里，紧跟其后的内联脚本在**求值时**
    按 location.search 把 sid / tid / cwd 写进去——不依赖 SDK、不依赖宿主 context、不依赖
    hana.envelope。聊天流态下这一行就是最终内容。
    
    两个挂载态各自的 DOM 按需实例化，不用 hidden / display 藏：
    · 聊天流：下面这行 #dsh-entry 就是全部（零 React 依赖，见 stream-entry.ts）；
    · 黑板 / 拆窗：stream-entry.ts 认到 height.mode=fixed 后**动态 import()** 重型 chunk
    （stream-stage.tsx：React 三态 + dsh-inject + host-theme），成功取到才拆掉
    入口行、实例化 <template id="tpl-stage">。取不到 chunk 时入口行留着，失败可见。
    
      注入的 DSH UI 就是那段会话本身：这一面不带 App 侧的状态行。
    相对资源纪律：页面里不出现根路径绝对 URL；重型 chunk 也走相对路径（rspack 的
    output.chunkFilename，见 packages/ui/src/rspack.config.mts），所以宿主以 /api/apps/<id>/ui/stream.html
      服务本页时它照样取得到。唯一例外是下面首帧片段里那条宿主主题路由 /api/apps/theme.css
      （宿主路由、公开，不是本 App 自己的资源；见该片段内的说明）。 -->
<link rel="stylesheet" href="./face-stage.css">
<style>
  /* 聊天流入口态：一行抬头 + 三行坐标（会话 / 目录 / 任务），宽扁卡（8:1）装得下。
     默认不显示：取出的卡（黑板 / 拆窗）首帧不许出现坐标行——只有认到聊天流态
     （body[data-stream-view="entry"]）才露出，认态在 stream-entry.ts 里做。 */
  #dsh-entry {
    box-sizing: border-box; height: 100%; padding: 10px 16px;
    display: none; flex-direction: column; justify-content: center; gap: 3px;
  }
  body[data-stream-view="entry"] #dsh-entry { display: flex; }
  #dsh-entry .entry-head { display: flex; align-items: center; gap: 10px; }
  #dsh-entry .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--accent, #537D96); }
  #dsh-entry .entry-state { flex: none; font-weight: 600; }
  #dsh-entry .entry-hint { margin-left: auto; flex: none; font-size: 11.5px; color: var(--text-muted, #6B6158); opacity: .85; }
  /* 小标题行里的跟踪态：片段由 App 后端给（.state / .dot / .detail），头行已经有一个圆点，
     这里把它那颗收起。 */
  #dsh-entry .entry-status { flex: none; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted, #6B6158); }
  #dsh-entry .entry-status .dot { display: none; }
  #dsh-entry .entry-status .state { display: flex; align-items: center; gap: 5px; margin: 0; min-width: 0; }
  /* detail 不占版面：轻半把它挪到悬停提示上（title），行里只留 label。 */
  #dsh-entry .entry-status [data-state] { cursor: help; }
  #dsh-entry .entry-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #dsh-entry .entry-key { flex: none; width: 2.8em; font-size: 11.5px; color: var(--text-muted, #6B6158); }
  #dsh-entry .entry-val {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }

</style>
<!-- dshana:first-frame-theme —— 首帧主题片段（五个页面逐字相同，回归闸 tests/ui/first-frame-theme.test.mjs）：
     位置固定在 <head> 内、所有静态 <link rel="stylesheet"> 之后、模块脚本之前；内容同步
     （不依赖 SDK、不 await），因为 <link> 阻塞首次绘制——第一帧就是宿主配色。 -->
<script>
  /* 首帧主题（同步）：宿主把主题参数附在 App surface iframe 的 URL 上（hana-theme /
     hana-theme-appearance / hana-css），但「把样式表贴进页面」宿主不代劳，@hana/plugin-sdk
     也只在收到 hana.theme.changed 时才应用 cssUrl——不自己贴，第一帧就会吃样式表里写死的
     纸张 fallback（模块那条路径要等一次 fetch，太晚）。此后的变化由 packages/ui/src/host-theme.ts
     订阅跟随。
     样式表 URL 分三档（与 host-theme.ts 的 themeCssUrlFor 同一条规则，两侧各半）：
       ① 宿主给了 hana-css —— 直接用（主卡 / 设置页走这条）；
       ② 没给 hana-css 但有 hana-theme —— 按主题拼 /api/apps/theme.css?theme=<id>（FP 走这条：
          它的 surface URL 只带 hana-theme / hana-theme-appearance，不带 hana-css）；
       ③ 两者都没有 —— **不贴**。裸 /api/apps/theme.css 返回的是**默认主题**（暖纸），不是用户
          当前主题；猜出来的颜色比不画更糟，所以宁可留白、让页面回落到自己 CSS 里的兜底色
          （官方口径同此：a failed swap keeps the current theme rather than falling back to a
          built-in palette）。
     /api/apps/theme.css 是**宿主路由**（公开、无需凭据；dsh-inject.ts 的 HOST_PATH_PREFIXES
     把 /api/apps/ 划为宿主前缀），不是本 App 自己的资源——页面内仍然不出现自身资源的根路径
     绝对 URL（那些一律相对路径）。
     贴过的 URL 记在 <html> 的 data-hana-theme-css 上：host-theme.ts 的 THEME_CSS_ATTR 读它，
     据此跳过同一个 URL 的重复 fetch（契约两侧各半，被上面的回归闸锁住）；没贴时这条属性不写，
     模块侧因此不会误判「已贴过」。
     失败（URL 畸形 / 拿不到主题）一律不阻断页面：留着兜底色继续走。 */
  (function () {
    "use strict";
    var root = document.documentElement;
    var q = null;
    try { q = new URLSearchParams(location.search); } catch (e) { /* 畸形 URL：当没带参数 */ }
    var get = function (k) { try { return q ? String(q.get(k) || "").trim() : ""; } catch (e) { return ""; } };
    try {
      var theme = get("hana-theme");
      var appearance = get("hana-theme-appearance");
      var css = get("hana-css");
      /* 没有 hana-css 但有主题 id：按主题拼确定的宿主路由（必须带 theme 参数）。 */
      if (!css && theme) css = "/api/apps/theme.css?theme=" + encodeURIComponent(theme);
      /* css 仍为空 = 主题完全未知：不贴表（贴一张默认主题的比不贴更糟）。 */
      if (theme) root.setAttribute("data-theme", theme);
      if (appearance === "light" || appearance === "dark") root.setAttribute("data-appearance", appearance);
      if (css) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = css;
        link.setAttribute("data-hana-theme-inline", "");
        (document.head || root).appendChild(link);
        root.setAttribute("data-hana-theme-css", css);
      }
    } catch (e) { /* 主题拿不到就用 fallback，不阻断 */ }
  }());
</script>
</head>
<body data-view="idle" data-dshana-view="stream">
  <!-- 入口行：聊天流态的最终内容。坐标由紧跟其后的内联脚本在求值时写入（不碰 SDK / 宿主握手）；
       但它默认不显示——认到聊天流态才由 stream-entry.ts 露出，所以取出的卡首帧不会出现这一行。
       右侧那句提示只在聊天流态有意义：取出（右上角菜单 / 拖拽）之后这张卡就是完整 DSH 现场。 -->
  <div id="dsh-entry">
    <div class="entry-head">
      <span class="dot"></span>
      <span class="entry-state" data-dsh-entry-state>DSHana 会话</span>
      <span class="entry-status" data-dsh-entry-status></span>
      <span class="entry-hint">取出卡片展开完整会话</span>
      </div>
    <div class="entry-row"><span class="entry-key">目录</span><span class="entry-val" data-dsh-entry-cwd></span></div>
    <div class="entry-row"><span class="entry-key">会话</span><span class="entry-val" data-dsh-entry-sid></span></div>
    <div class="entry-row"><span class="entry-key">任务</span><span class="entry-val" data-dsh-entry-tid></span></div>
  </div>
  <script>
    /* 求值时只做坐标这件事，不依赖 SDK / 宿主 context / hana.envelope：
       ?sid= &tid= &cwd=（字段与 packages/tools/src/shared/card.ts 的 route 查询串同源，
       都经 encodeURIComponent）。
       主题不在这里：首帧那一步移到了 <head> 里的同名片段（所有静态样式表之后、模块脚本之前），
       此后由 packages/ui/src/host-theme.ts 订阅跟随。
       失败（URL 畸形）一律不阻断页面：留着占位文案继续走。 */
    (function () {
      "use strict";
      var root = document.documentElement;
      var q = null;
      try { q = new URLSearchParams(location.search); } catch (e) { /* 忽略 */ }
      var get = function (k) { try { return q ? String(q.get(k) || "").trim() : ""; } catch (e) { return ""; } };
      /* 卡内第一行：动作对应的状态字样。文案住在这里（不是 route 上的 act），所以改文案对
         已经发出的卡也生效——卡页每次都从安装树现取。**只属于聊天流态**：取出的卡不显示
         这一行，那边的状态由卡状态行负责。 */
      var ACT_TEXT = { open: "新会话", reply: "续会话" };
      var stateEl = document.querySelector("[data-dsh-entry-state]");
      if (stateEl) stateEl.textContent = ACT_TEXT[get("act")] || "DSHana 会话";
      var setRow = function (sel, value) {
        var el = document.querySelector(sel);
        if (!el) return;
        el.textContent = value || "";
        /* 空值就把整行收起来（不留下悬空的标签）。不用 hidden 属性：.entry-row 的 display
           由作者样式给，会盖过 UA 的 [hidden]。 */
        var row = el.closest(".entry-row");
        if (row) row.style.display = value ? "" : "none";
      };
      setRow("[data-dsh-entry-sid]", get("sid") || "（这张卡没有带会话坐标）");
      setRow("[data-dsh-entry-cwd]", get("cwd"));
      setRow("[data-dsh-entry-tid]", get("tid"));
      /* 兜底：模块没能接管（脚本没加载 / 报错）时也要把入口行露出来，别让这张卡空着。 */
      setTimeout(function () {
        if (root.getAttribute("data-dshana-stream") !== "claimed") {
          document.body.setAttribute("data-stream-view", "entry");
        }
      }, 3000);
    }());
  </script>
  <!-- 黑板 / 拆窗态的自举台：只有容器，内容（loader / 状态行 / 诊断块）由重型 chunk 的 React 画。
         模板内容既不渲染也不执行；实例化只发生在 stream-entry.ts 取到重型 chunk 之后。 -->
  <template id="tpl-stage">
    <div id="dsh-stage"></div>
  </template>
  <script type="module" src="./stream.js"></script>
</body>
</html>
