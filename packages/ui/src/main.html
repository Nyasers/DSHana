<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 本页的面（role）的事实源：静态声明，和样例 hana-dsh 的 <meta name="hana-dsh-role"> 同一姿势。
     宿主加载本页时不会带我们的任何参数（FP 走 functionPanel.routeUrl），所以"我是谁"只能写在页面自己身上。 -->
<meta name="hana-dshana-role" content="main">
<title>DSHana</title>
<!-- packages/ui/src/main.html — dshana App v2 主壳页（contributes.cards dshana route，单卡）。
     视觉沿袭纸张风（宿主主题变量 + 纸张 fallback，明暗随主题），数据语义 v2（boot-state 快照
     phase idle/starting/ready/error/stopped）。台面只有一副：DSHANA 字标 + 细圆环 + 一行状态
     小字，报错时下方直接一块 <pre>（唯一保留的诊断面）。ready 后整块让给注入的 DSH Web UI
     （同文档注入，不是 iframe）。无 emoji、无渐变/阴影光效。
     自举台面的样式与 default / stream 两个面共用（./face-stage.css）：底色、#root、台面、
     日志块、台面按钮都在那份里，本页不自带 <style>。
     到本 App 后端路由一律 hana.api.fetch（surface session 凭据，见 app-shell.js）。
     body 上的 data-dshana-shell 是壳脚本的根锚（app-shell.js boot() 取它，缺失则不轮询）；
     data-dshana-view="main" 决定 role（workspace）。侧栏归本卡的功能面板 /sidebar.html。
     主题：首帧由下面 <head> 里的内联片段贴样式表（所有静态样式表之后），此后由
     packages/ui/src/host-theme.ts 订阅跟随（app-shell.js 侧接上）。 -->
<link rel="stylesheet" href="./face-stage.css">
<!-- dshana:first-frame-theme —— 首帧主题片段（五个页面逐字相同，回归闸 tests/ui/first-frame-theme.test.mjs）：
     位置固定在 <head> 内、所有静态 <link rel="stylesheet"> 之后、模块脚本之前；内容同步
     （不依赖 SDK、不 await），因为 <link> 阻塞首次绘制——第一帧就是宿主配色。 -->
<script>
  /* 首帧主题（同步）：宿主把主题参数附在 App surface iframe 的 URL 上（hana-theme /
     hana-theme-appearance / hana-css），但「把样式表贴进页面」宿主不代劳，@hana/plugin-sdk
     也只在收到 hana.theme.changed 时才应用 cssUrl——不自己贴，第一帧就会吃样式表里写死的
     纸张 fallback（模块那条路径要等一次 fetch，太晚）。此后的变化由 packages/ui/src/host-theme.ts
     订阅跟随。
     样式表 URL 分三档（与 host-theme.ts 的 themeCssUrlFor 同一条规则，两侧各半）：
       ① 宿主给了 hana-css —— 直接用（主卡 / 设置页走这条）；
       ② 没给 hana-css 但有 hana-theme —— 按主题拼 /api/apps/theme.css?theme=<id>（FP 走这条：
          它的 surface URL 只带 hana-theme / hana-theme-appearance，不带 hana-css）；
       ③ 两者都没有 —— **不贴**。裸 /api/apps/theme.css 返回的是**默认主题**（暖纸），不是用户
          当前主题；猜出来的颜色比不画更糟，所以宁可留白、让页面回落到自己 CSS 里的兜底色
          （官方口径同此：a failed swap keeps the current theme rather than falling back to a
          built-in palette）。
     /api/apps/theme.css 是**宿主路由**（公开、无需凭据；dsh-inject.ts 的 HOST_PATH_PREFIXES
     把 /api/apps/ 划为宿主前缀），不是本 App 自己的资源——页面内仍然不出现自身资源的根路径
     绝对 URL（那些一律相对路径）。
     贴过的 URL 记在 <html> 的 data-hana-theme-css 上：host-theme.ts 的 THEME_CSS_ATTR 读它，
     据此跳过同一个 URL 的重复 fetch（契约两侧各半，被上面的回归闸锁住）；没贴时这条属性不写，
     模块侧因此不会误判「已贴过」。
     失败（URL 畸形 / 拿不到主题）一律不阻断页面：留着兜底色继续走。 */
  (function () {
    "use strict";
    var root = document.documentElement;
    var q = null;
    try { q = new URLSearchParams(location.search); } catch (e) { /* 畸形 URL：当没带参数 */ }
    var get = function (k) { try { return q ? String(q.get(k) || "").trim() : ""; } catch (e) { return ""; } };
    try {
      var theme = get("hana-theme");
      var appearance = get("hana-theme-appearance");
      var css = get("hana-css");
      /* 没有 hana-css 但有主题 id：按主题拼确定的宿主路由（必须带 theme 参数）。 */
      if (!css && theme) css = "/api/apps/theme.css?theme=" + encodeURIComponent(theme);
      /* css 仍为空 = 主题完全未知：不贴表（贴一张默认主题的比不贴更糟）。 */
      if (theme) root.setAttribute("data-theme", theme);
      if (appearance === "light" || appearance === "dark") root.setAttribute("data-appearance", appearance);
      if (css) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = css;
        link.setAttribute("data-hana-theme-inline", "");
        (document.head || root).appendChild(link);
        root.setAttribute("data-hana-theme-css", css);
      }
    } catch (e) { /* 主题拿不到就用 fallback，不阻断 */ }
  }());
</script>
</head>
<body data-view="idle" data-dshana-shell data-dshana-view="main">
  <div id="dsh-stage">
    <div class="loader">
      <span class="wordmark">DSHANA</span>
      <span class="ring" id="dsh-spin" hidden></span>
      <p id="dsh-status">正在读取状态…</p>
    </div>
    <div id="boot-panel"></div>
  </div>
  <script type="module" src="./app-shell.js"></script>
</body>
</html>
