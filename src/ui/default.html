<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 本页的面（role）的事实源：静态声明。三态模型里它就是 **default**——
     full（整幅 DSH UI：侧栏 + 中列 + 右列）与 detached（拆窗）共用这一页，内容完全一样；
     另两态是 main（主卡，无 DSH 侧栏）与 sidebar（FP，只有侧栏）。 -->
<meta name="hana-dshana-role" content="default">
<title>DSHana</title>
<!-- src/ui/default.html — dshana App v2 的 **default 面**（full / detached 共用）。
     detached 的语义（APPS.md）：同一张卡的独立窗口加载本页、**不再额外挂载 functionPanel**，
     钉回时恢复原 route 与 FP；卡 ID / App 后台 / 持久状态不变。所以这一面渲染完整的 DSH
     Web UI（侧栏 + 中列 + 右列）——与主卡（无 DSH 侧栏）不同。

     顶上不再让开 44px：卡片 titlebar 改成 solid 之后，不透明标题栏是**占位**而非浮层，
     页面可以直接从顶部开始。当初那段留白是给半透明 chrome 的（官方样例为设置面留的
     也是同一块区域），现随 titlebar 一起收回。

     自举台面的样式与 main / stream 两个面共用（./face-stage.css），本页不再自带 <style>。 -->
<link rel="stylesheet" href="./face-stage.css">
</head>
<body data-view="idle" data-dshana-shell data-dshana-view="default">
  <div id="dsh-stage">
    <div class="loader">
      <span class="wordmark">DSHANA</span>
      <span class="ring" id="dsh-spin" hidden></span>
      <p id="dsh-status">正在读取状态…</p>
    </div>
    <div id="boot-panel"></div>
  </div>
  <script type="module" src="./app-shell.js"></script>
</body>
</html>
