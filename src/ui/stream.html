<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 本页的面（role）的事实源：静态声明。stream 面 = **只读会话流**——
     复用 DSH 前端、只留中列那一段转录，DSH 侧栏、右列与输入卡（composer card）全部收起。
     语义：看，不参与。输入与打断仍走 dshana 工具链，这一面不提供任何写入口。 -->
<meta name="hana-dshana-role" content="stream">
<title>DSHana 会话</title>
<!-- src/ui/stream.html — dshana 的会话卡，同一页两个挂载态（由 app-shell 认）：
       · 聊天流里（宿主 mount 的 height 是 flexible）：只画一行入口（会话坐标），不注入 DSH、
         不连中继——所以不叠也不冻结。这是工具出卡（details.card）落进来的形态。
       · 取出到黑板 / 拆窗（height 是 fixed）：宿主把同一 route 装到新挂载上，本页此时才装配
         中继、注入完整 DSH 现场（./face-stage.css 的台面 → DSH Web UI）。
     两种进入方式共用这一页：聊天卡带 sid=<DSH session id> 钉住一段会话；主题、surface
     凭据与「认面」都走壳脚本那一套（见 app-shell.ts / face-role.ts / host-theme.ts）。
     与 main / default 同一副自举台面（./face-stage.css），ready 后把整幅让给注入的 DSH
     Web UI，由 ui-layout 覆盖层按 surface=stream 只画中列、并由 CSS 摘掉 [data-composer-card]（输入卡）；
     座位（[data-composer-seat]）留着，统计信息行就挂在它里面。
     注入的 DSH UI 里带 sid 的会话，app-shell 在顶部再挂一行跟踪态（取 GET /dshana/card-state：
     只在 tracked / cancelling 期间慢轮询 4s，其余状态停手）。**终态之后不断流**：这段会话多半是
     用户主动打开来翻看的历史会话，断掉或拒绝重开就等于看不了。
     body 上的 data-dshana-shell 是壳脚本的根锚（boot() 取它，缺失则什么都不做）。 -->
<link rel="stylesheet" href="./face-stage.css">
<style>
  /* 聊天流入口态：一行坐标。样式与台面无关，只为聊天卡那一格服务。
     这块 DOM 只在 entry 态才被实例化（见 app-shell.ts 的 mountStreamView），所以不必自藏。 */
  #dsh-entry {
    box-sizing: border-box; height: 100%; padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  #dsh-entry .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--border, #8a93a3); }
  #dsh-entry .entry-texts { min-width: 0; flex: 1; }
  #dsh-entry .entry-label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dsh-entry .entry-meta {
    margin-top: 2px; font-size: 11.5px; color: var(--text-muted, #6B6158);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 卡状态行（app-shell 在带 sid 的黑板面顶部挂的一条）：内容就是 App 后端 /dshana/card-state
     返回的那段片段（.state / .dot / .detail），所以那三个类名是卡页的渲染契约。 */
  #dshana-card-strip {
    display: flex; align-items: center; gap: 6px;
    height: 31px; box-sizing: border-box; padding: 0 12px;
    font-size: 12.5px; color: var(--text-muted, #6B6158);
    background: var(--bg-card, #FBF7EE);
    border-bottom: 1px solid var(--border, #D8CFBE);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #dshana-card-strip .state { display: flex; align-items: center; gap: 6px; margin: 0; min-width: 0; }
  #dshana-card-strip .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent, #537D96); }
  #dshana-card-strip .state[data-state="ended"] .dot { background: var(--text-muted, #6B6158); }
  #dshana-card-strip .state[data-state="cancelling"] .dot { background: var(--danger, #B0453E); }
  #dshana-card-strip .state[data-state="unknown"] .dot { background: var(--border, #D8CFBE); }
  #dshana-card-strip .detail { overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-view="idle" data-dshana-shell data-dshana-view="stream">
  <!-- 两个挂载态各自的 DOM 只在认到该态时才实例化（app-shell.ts 的 mountStreamView）：模板内容
       不进渲染树、不执行脚本，实例化哪一个由 hana.envelope 认出的挂载态决定。不用 hidden /
       display 藏：藏起来的子树仍占着 DOM（活着的那种还会继续跑），而这两态本来就不该同时在。 -->
  <template id="tpl-entry">
    <div id="dsh-entry">
      <span class="dot"></span>
      <div class="entry-texts">
        <div class="entry-label" data-dsh-entry-label>DSH 会话</div>
        <div class="entry-meta" data-dsh-entry-meta>正在读取坐标…</div>
      </div>
    </div>
  </template>
  <template id="tpl-stage">
    <div id="dsh-stage">
      <div class="loader">
        <span class="wordmark">DSHANA</span>
        <span class="ring" id="dsh-spin" hidden></span>
        <p id="dsh-status">正在读取状态…</p>
      </div>
      <div id="boot-panel"></div>
    </div>
  </template>
  <script type="module" src="./app-shell.js"></script>
</body>
</html>
