# 多包工作区：源树内互相引用走 workspace 协议
# 仓库根仍是构建入口所在的项目（scripts/、integrations/）
packages:
  # 宿主侧在 packages/
  - "packages/*"
  # DSH 侧在 packages/dsh/
  - "packages/*/*"

# pnpm 构建脚本白名单
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  koffi: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

# 安全审计白名单
# picomatch 4.0.7 命中 GHSA-fc5q-39xc-vjpf（ReDoS via analyzeRepeatedExtglob）：
# npm latest 与上游最后 release 都是 4.0.7，没有可升的 patched 版本。
# 跟踪入口 micromatch/picomatch#247：advisory 在争议中，已向 CNA 提交撤回请求，
# 触发需要外部控制 glob 模式；本仓只在 dsh-hmr 里匹配自己的 ignored 配置，够不到。
# advisory 被撤销或上游发修复版，任一发生就删掉这条；后者按 overrides 的「安全修复」惯例钉版本。
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

overrides:
  # HanaApp SDK
  "@hana/app-sdk": "file:vendor/hana-app-sdk/hana-app-sdk.tgz"
  "@hana/plugin-sdk": "file:vendor/hana-app-sdk/hana-plugin-sdk-0.0.0.tgz"
  "@hana/plugin-protocol": "file:vendor/hana-app-sdk/hana-plugin-protocol-0.0.0.tgz"
  "@hana/plugin-components": "file:vendor/hana-app-sdk/hana-plugin-components-0.0.0.tgz"

  # vendor 线：上游 alpha.1 的 lib 已改用 1.2.0-alpha.1 的导出（parseEntryYaml /
  # stringifyEntryYaml、loader 的 EntryValidationError），但它自己声明的仍是 ~1.1.0；
  # 装 1.1.0 时 profile-boot 会因缺命名导出而 import 失败。所以 include 只能留
  # 1.2.0-alpha.1，而它与 loader 1.2.0-alpha.1 自带 peer cordis ~4.2.0-alpha.1，
  # 整条 vendor 线因此被拉到 alpha.2 批。硬把 cordis 钉回 4.1.0 会直接 import 失败，
  # 这条不能与 a1 同批，只能与 alpha.2 同批。
  "@deepseek-ai/cordis-plugin-include": "1.2.0-alpha.1"

  # 不使用的产品面
  "@deepseek-ai/dsh-acp-app": "-"
