# 多包工作区：源树内互相引用走 workspace 协议
# 仓库根仍是构建入口所在的项目（scripts/、integrations/）
packages:
  # 宿主侧在 packages/
  - "packages/*"
  # DSH 侧在 packages/dsh/
  - "packages/*/*"

# pnpm 构建脚本白名单
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  koffi: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

overrides:
  # HanaApp SDK
  "@hana/app-sdk": "file:vendor/hana-app-sdk/hana-app-sdk.tgz"
  "@hana/plugin-sdk": "file:vendor/hana-app-sdk/hana-plugin-sdk-0.0.0.tgz"
  "@hana/plugin-protocol": "file:vendor/hana-app-sdk/hana-plugin-protocol-0.0.0.tgz"
  "@hana/plugin-components": "file:vendor/hana-app-sdk/hana-plugin-components-0.0.0.tgz"

  # 不使用的产品面
  "@deepseek-ai/dsh-acp-app": "-"
  "@deepseek-ai/dsh-api-account-controller": "-"
  "@deepseek-ai/dsh-client-product-analytics": "-"
  "@deepseek-ai/dsh-client-ui-deepseek-model-label-1017": "-"
  "@deepseek-ai/dsh-client-ui-entry-customization": "-"
  "@deepseek-ai/dsh-client-ui-message-feedback": "-"
  "@deepseek-ai/dsh-client-ui-settings-account": "-"
  "@deepseek-ai/dsh-client-ui-settings-session-log": "-"
  "@deepseek-ai/dsh-command-feedback": "-"
  "@deepseek-ai/dsh-deepseek-account": "-"
  "@deepseek-ai/dsh-deepseek-account-platform": "-"
  "@deepseek-ai/dsh-deepseek-llm-api-extensions": "-"
  "@deepseek-ai/dsh-headless": "-"
  "@deepseek-ai/dsh-host-product-telemetry-otel": "-"
  "@deepseek-ai/dsh-llm-deepseek": "-"
  "@deepseek-ai/dsh-llm-deepseek-account": "-"
  "@deepseek-ai/dsh-llm-deepseek-api-key": "-"
  "@deepseek-ai/dsh-llm-pi-ai": "-"
  "@deepseek-ai/dsh-message-feedback": "-"
  "@deepseek-ai/dsh-otel": "-"
  "@deepseek-ai/dsh-plugin-package-inventory-deepseek": "-"
  "@deepseek-ai/dsh-sdk-app": "-"
  "@deepseek-ai/dsh-sdk-minimal": "-"
  "@deepseek-ai/dsh-session-log-deepseek": "-"
  "@deepseek-ai/dsh-session-log-export": "-"
  "@deepseek-ai/dsh-session-telemetry": "-"
  "@deepseek-ai/dsh-session-telemetry-otel": "-"
  "@deepseek-ai/dsh-skill-office": "-"
  "@deepseek-ai/dsh-subagent-claude-code": "-"
  "@deepseek-ai/dsh-subagent-codex": "-"
  "@deepseek-ai/dsh-web-app": "-"

  # 按需安装的包
  # >>> excluded-on-demand
  "@deepseek-ai/dsh-experimental-agent-team-profile": "-"
  "@deepseek-ai/dsh-experimental-auto-review": "-"
  "@deepseek-ai/dsh-experimental-badge-skill-bundle": "-"
  "@deepseek-ai/dsh-experimental-cot-translation-bundle": "-"
  "@deepseek-ai/dsh-experimental-inspector-profile": "-"
  "@deepseek-ai/dsh-experimental-plugin-market-bundle": "-"
  "@deepseek-ai/dsh-experimental-ralph-bundle": "-"
  "@deepseek-ai/dsh-experimental-session-search": "-"
  "@deepseek-ai/dsh-experimental-session-titles-bundle": "-"
  "@deepseek-ai/dsh-experimental-terminal-bundle": "-"
  "@deepseek-ai/dsh-experimental-tool-worktree": "-"
  "@deepseek-ai/dsh-experimental-voice-input-bundle": "-"
  # <<< excluded-on-demand

  # 安全修复
  ## CVE-2023-54404
  zod: 4.6.7
  ## CVE-2026-111769
  "@modelcontextprotocol/client": 2.3.1

# 打包目标设置
# >>> pack-targets
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
# <<< pack-targets
