# 多包工作区：我们自己那几个包住在 packages/ 下（@dshana/shared 等），源树内互相引用走
# workspace 协议。仓库根仍是构建入口所在的项目（scripts/、integrations/）。
packages:
  - "packages/*"
  # 组合层住得更深一层（packages/bundle/dsh-app），与上游 packages/bundle/* 的布局对齐。
  - "packages/*/*"

# pnpm 构建脚本白名单。pnpm 11 起 allowBuilds 取代 pnpm 10 的 onlyBuiltDependencies 一族
# （onlyBuiltDependencies / neverBuiltDependencies / onlyBuiltDependenciesFile / ignoredBuiltDependencies
# 已被静默忽略），所以旧的数组写法在这里不会生效。
# dsh 运行时树依赖的 install scripts：部署（pnpm add 到数据目录 dsh-pkg）时需放行。
# 本地开发（pnpm install 装构建树）与 CI（--frozen-lockfile）同样读取本文件，白名单不参与 lockfile 解析。
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  koffi: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

# 本地 vendor 的官方 SDK（非 registry 包）：只能放这里（pnpm 11+ 不再读 package.json 的 pnpm 字段，
# 那份会被打印为 ignored）。四个 tgz 全部映射到本地，任何对 @hana/* 的依赖（直接
# 或传递）都解析到 vendor（版本 0.0.0），不去 registry 取（registry 上没有，否则 404）。
#   - app-sdk：Node 侧 App 契约（connectAppRuntime 等；runtime bundle 构建期内联）
#   - plugin-sdk：浏览器侧（dist/browser.js，ui bundle 构建期内联）
#   - plugin-protocol：plugin-sdk 的声明依赖（浏览器构建已内联，仅解析用）
#   - plugin-components：设置面公共组件（@hana/plugin-components/settings，自绘设置页用）
overrides:
  "@hana/app-sdk": "file:vendor/hana-app-sdk/hana-app-sdk.tgz"
  "@hana/plugin-sdk": "file:vendor/hana-app-sdk/hana-plugin-sdk-0.0.0.tgz"
  "@hana/plugin-protocol": "file:vendor/hana-app-sdk/hana-plugin-protocol-0.0.0.tgz"
  "@hana/plugin-components": "file:vendor/hana-app-sdk/hana-plugin-components-0.0.0.tgz"
  # 安全告警 http-cache-semantics <=4.2.0（high）整条链只从 `dsh-otel` 进来（pnpm why got：唯一依赖者
  # 就是它），所以这里把 dsh-otel 换成空实现，got/cacheable-request/http-cache-semantics 一起离开树
  # （见 vendor/stubs/dsh-otel/）。前提：引用它的只有 base roster 那两行遥测，而那两行已在组合层
  # （packages/bundle/dsh-app/cordis.patch.yml）按 id 关掉。
  "@deepseek-ai/dsh-otel": "file:vendor/stubs/dsh-otel"
  "@deepseek-ai/dsh-session-telemetry-otel": "file:vendor/stubs/dsh-session-telemetry-otel"
  "@deepseek-ai/dsh-host-product-telemetry-otel": "file:vendor/stubs/dsh-host-product-telemetry-otel"
  "@deepseek-ai/dsh-session-telemetry": "file:vendor/stubs/dsh-session-telemetry"

# 已知且暂时无补丁可钉的安全告警——目前**没有**（http-cache-semantics 那条整条链已随 dsh-otel
# 换空实现离开依赖树）。保留这个段落作位置：将来碰到同类无补丁的告警，在这里记理由与复核时点，
# 而不是默默放宽阈值。
auditConfig:
  ignoreGhsas: []

# >>> pack-targets
# 打包目标设置（pack 会按目标替换标记块内的 supportedArchitectures；勿在标记外重复定义）。
# 这一份服务**本地开发安装**：默认全叉乘（win32/darwin/linux × x64/arm64），便于本地随时重打包；
# 出包时由 pack 按目标窄化到该目标的 os/cpu，或保留全叉乘出通用兜底包。
# 注：pnpm 11+ 不再读 package.json 的 pnpm 字段（会打印 ignored 警告），该设置只能放这里。
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
# <<< pack-targets
